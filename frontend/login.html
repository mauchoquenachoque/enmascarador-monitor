<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Multi-DB Masking Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%); }
        .card-glow { box-shadow: 0 0 40px rgba(59, 130, 246, 0.1); }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-gray-900 rounded-2xl shadow-2xl p-8 border border-gray-800 card-glow">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600/20 mb-4">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Multi-DB Masking Monitor</h1>
                <p class="text-gray-400 mt-1 text-sm">SecOps / DBA Performance Platform</p>
            </div>

            <div id="error-message" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm"></div>
            <div id="success-message" class="hidden bg-green-500/10 border border-green-500/30 text-green-400 px-4 py-3 rounded-lg mb-4 text-sm"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Usuario</label>
                    <input type="text" id="username" required autocomplete="username"
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 input-focus focus:outline-none focus:border-blue-500 transition"
                        placeholder="Ingresa tu usuario">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password"
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 input-focus focus:outline-none focus:border-blue-500 transition"
                        placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit" id="btn-login"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
                    Iniciar Sesión
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                <p>Credenciales por defecto</p>
                <p class="text-gray-400 font-mono mt-1">admin / Admin123!</p>
            </div>
        </div>

        <div class="mt-6 flex justify-center gap-4 text-xs text-gray-600">
            <span>v5.0.0</span>
            <span>•</span>
            <span>FastAPI</span>
            <span>•</span>
            <span>7 DB Engines</span>
            <span>•</span>
            <span>4 Masking Algorithms</span>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errDiv = document.getElementById('error-message');
            const okDiv = document.getElementById('success-message');

            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Autenticando...';
            errDiv.classList.add('hidden');
            okDiv.classList.add('hidden');

            try {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    throw new Error('Ingresa usuario y contraseña');
                }

                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ detail: 'Error de conexión' }));
                    throw new Error(err.detail || `Error ${res.status}`);
                }

                const data = await res.json();
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);

                okDiv.textContent = 'Login exitoso. Redirigiendo...';
                okDiv.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = '/static/dashboard.html';
                }, 500);

            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg> Iniciar Sesión';
            }
        });

        if (localStorage.getItem('access_token')) {
            window.location.href = '/static/dashboard.html';
        }
    </script>
</body>
</html>
