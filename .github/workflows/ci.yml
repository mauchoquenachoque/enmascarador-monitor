name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Ruff Lint
        run: cd backend && ruff check app/ tests/
      - name: Ruff Format Check
        run: cd backend && ruff format --check app/ tests/
      - name: Mypy Type Check
        run: cd backend && mypy app/ --ignore-missing-imports
      - name: Bandit Security Scan
        run: cd backend && bandit -r app/ -ll

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run Tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -f docker/Dockerfile.backend -t masking-monitor-backend ./backend
      - name: Build Frontend Docker Image
        run: docker build -f docker/Dockerfile.frontend -t masking-monitor-frontend .
